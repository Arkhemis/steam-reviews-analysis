version: 2

models:
  - name: steam_review_contested
    description: >
      Identifiants de reviews chargés en plusieurs versions, à dédoublonner par
      steam_review. Isolé dans son propre modèle pour que les deux branches du
      UNION ALL lisent une table et non un CTE partagé.
    columns:
      - name: recommendation_id
        description: Identifiant Steam de la review, présent au moins deux fois dans raw.
        data_tests:
          - unique
          - not_null
