version: 2

sources:
  - name: raw
    description: Données brutes chargées par Dagster (IGDB + Steam), cf. db/clickhouse/init.sql.
    schema: raw
    loader: dagster

    tables:
      - name: igdb_games
        description: Jeux IGDB liés à Steam, une ligne par édition Steam, enrichis (noms alternatifs, type, statut, genres, thèmes, modes, moteurs, sociétés, cover).
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - igdb_id
                  - steam_app_id
        config:
          meta:
            dagster:
              asset_key: ['igdb_games']
        columns:
          - name: igdb_id
            description: Identifiant IGDB du jeu.
            data_tests:
              - not_null
          - name: steam_app_id
            description: Identifiant d'une édition Steam du jeu.
          - name: name
            description: Nom du jeu.
          - name: alternative_names
            description: Autres noms du jeu (acronymes, titres traduits ou d'origine).
          - name: first_release_date
            description: Date de première sortie du jeu.
          - name: game_type
            description: Type IGDB (Main Game, DLC, Bundle, Remake, Port…).
          - name: game_status
            description: Statut IGDB (Released, Early Access, Offline, Cancelled…), NULL si non renseigné.
          - name: genres
            description: Genres du jeu (noms résolus).
          - name: themes
            description: Thèmes du jeu (Horror, Survival, Open world…).
          - name: game_modes
            description: Modes de jeu (Single player, Multiplayer, Co-operative…).
          - name: player_perspectives
            description: Perspectives (First person, Third person, Bird view…).
          - name: game_engines
            description: Moteurs du jeu.
          - name: developers
            description: Studios développeurs (noms résolus depuis involved_companies).
          - name: publishers
            description: Éditeurs (noms résolus depuis involved_companies).
          - name: porting_companies
            description: Studios ayant porté le jeu.
          - name: supporting_companies
            description: Studios en soutien du développement.
          - name: developer_countries
            description: Pays des studios développeurs (ISO 3166-1 alpha-2).
          - name: parent_companies
            description: Groupe de tête des développeurs et éditeurs, quand ils en ont un.
          - name: cover_url
            description: URL de la jaquette du jeu (t_cover_big).
          - name: loaded_at
            description: Horodatage de chargement par Dagster.

      - name: steam_review_counts
        description: Recensement du nombre de reviews par jeu Steam (compteurs agrégés).
        config:
          meta:
            dagster:
              asset_key: ['steam_review_counts']
        columns:
          - name: app_id
            description: Identifiant de l'application Steam (clé primaire).
            data_tests:
              - unique
              - not_null
          - name: total_reviews
            description: Nombre total de reviews.
          - name: total_positive
            description: Nombre de reviews positives.
          - name: total_negative
            description: Nombre de reviews négatives.
          - name: review_score
            description: Score de review Steam (0-9).
          - name: review_score_desc
            description: Libellé du score de review.
          - name: checked_at
            description: Horodatage du dernier recensement.
          - name: prev_total_reviews
            description: Nombre total de reviews au recensement précédent.
          - name: last_backfill_at
            description: Horodatage du dernier backfill complet pour ce jeu.
          - name: total_reviews_backfilled
            description: Nombre de reviews chargées lors du dernier backfill complet.
          - name: is_delisted
            description: >
              Fiche retirée du store : GetAppReviews ne renvoie plus rien et la page
              du jeu redirige vers l'accueil.

      - name: steam_reviews
        description: >
          Reviews individuelles Steam, telles que renvoyées par l'API (une ligne par version).
          Alimentée par steam_reviews_backfill puis par steam_reviews_incremental.
        config:
          meta:
            dagster:
              asset_key: ['steam_reviews_incremental']
        # Pas de test d'unicité : raw garde toutes les versions de chaque review.
        columns:
          - name: recommendation_id
            description: Identifiant Steam de la review (unique par jeu, pas globalement).
            data_tests:
              - not_null
          - name: app_id
            description: Identifiant de l'application Steam concernée.
            data_tests:
              - not_null
          - name: payload
            description: >
              Payload de la review en type JSON : les clés à null et les objets
              vides disparaissent, un chemin absent se lit comme NULL.
          - name: timestamp_created
            description: Timestamp Unix de création de la review.
          - name: timestamp_updated
            description: Timestamp Unix de dernière mise à jour, utilisé pour l'incrémental/dédup.
            data_tests:
              - not_null
          - name: loaded_at
            description: Horodatage de chargement par Dagster.

      - name: steam_events
        description: >
          Annonces Steam par jeu (patch notes, MAJ, actus).
          Limitée aux jeux au-dessus du seuil de reviews.
        config:
          meta:
            dagster:
              asset_key: ['steam_events']
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - app_id
                  - gid
        columns:
          - name: gid
            description: Identifiant Steam de l'annonce (unique par jeu, pas globalement).
            data_tests:
              - not_null
          - name: app_id
            description: Identifiant de l'application Steam concernée.
            data_tests:
              - not_null
          - name: payload
            description: Payload JSON brut de l'annonce (String).
          - name: payload_hash
            description: Empreinte du payload, calculée par Dagster pour n'écrire que les annonces modifiées.
          - name: rtime32_start_time
            description: >
              Timestamp Unix de publication de l'annonce, borne du croisement avec la
              courbe de reviews.
          - name: loaded_at
            description: Dernière modification du payload, réécrit par Dagster seulement s'il a changé.

      - name: steam_game_details
        description: >
          Fiches store Steam par jeu (type d'app, jeu parent des DLC, early access,
          dates de sortie), apps retirées du store comprises.
        config:
          meta:
            dagster:
              asset_key: ['steam_game_details']
        columns:
          - name: app_id
            description: Identifiant de l'application Steam (clé primaire).
            data_tests:
              - unique
              - not_null
          - name: payload
            description: Item JSON brut de IStoreBrowseService/GetItems (String).
          - name: loaded_at
            description: Horodatage de chargement par Dagster.
