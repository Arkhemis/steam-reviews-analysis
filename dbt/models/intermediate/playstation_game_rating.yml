version: 2

models:
  - name: playstation_game_rating
    description: Note des joueurs du PS Store US par jeu IGDB, pour les jeux notés.
    columns:
      - name: igdb_id
        data_tests:
          - unique
          - not_null
      - name: playstation_average_rating
        description: Note moyenne sur 5, pondérée par le nombre de notes de chaque concept.
      - name: playstation_rating_count
        description: Nombre de notes, tous concepts confondus.
      - name: playstation_platforms
        description: Plateformes couvertes par ces notes (PS4, PS5…). Un concept cross-gen n'a qu'une note pour les deux.
      - name: playstation_concept_id
        description: Concept le plus noté, celui vers lequel pointer sur le PS Store (store.playstation.com/concept/<id>).
