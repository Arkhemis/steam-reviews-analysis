version: 2

models:
  - name: playstation_game_rating
    description: Note des joueurs du PS Store US par jeu IGDB, pour les jeux notés.
    columns:
      - name: igdb_id
        data_tests:
          - unique
          - not_null
      - name: playstation_average_rating
        description: Note moyenne sur 5, pondérée par le nombre de notes de chaque édition.
      - name: playstation_rating_count
        description: Nombre de notes, toutes éditions confondues.
