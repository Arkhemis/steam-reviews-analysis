version: 2

models:
  - name: language_review_score
    description: >
      Volume et note (% d'avis positifs) par langue déclarée, pour chaque jeu.
      Une ligne par (app_id, language).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - app_id
              - language
    columns:
      - name: app_id
        description: Identifiant de l'application Steam concernée.
        data_tests:
          - not_null

      - name: language
        description: >
          Langue déclarée de la review (code langue Steam, ex. french,
          english), ou 'unknown' si le payload source n'en contient pas.
        data_tests:
          - not_null

      - name: total_reviews
        description: Nombre de reviews de ce jeu écrites dans cette langue.
        data_tests:
          - not_null

      - name: total_positive
        description: >
          Nombre de reviews positives (voted_up) de ce jeu dans cette langue.
        data_tests:
          - not_null

      - name: pct_positive
        description: Part de total_positive sur total_reviews, entre 0 et 1.
        data_tests:
          - not_null

      - name: pct_of_total
        description: >
          Part de total_reviews sur le total de reviews du jeu (toutes langues
          confondues), entre 0 et 1.
        data_tests:
          - not_null
