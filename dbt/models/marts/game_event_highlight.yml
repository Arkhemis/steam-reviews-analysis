version: 2

models:
  - name: game_event_highlight
    description: >
      Annonces marquantes d'un jeu, prêtes à annoter la courbe de reviews :
      une ligne par (app_id, gid), réduite aux événements news et update.
      Chaque année d'un jeu retient les trois annonces qui ont le plus fait
      réagir, plus jusqu'à deux annonces controversées repêchées. Le corps de
      l'annonce (announcement_text) n'est pas repris : l'infobulle n'affiche
      que le titre, les compteurs et une vignette, et le BBCode brut pèse plus
      que tout le reste du modèle réuni.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - app_id
              - gid
    columns:
      - name: app_id
        description: Identifiant de l'application Steam concernée.
        data_tests:
          - not_null

      - name: gid
        description: Identifiant Steam de l'événement, cf. staging.steam_event.
        data_tests:
          - not_null

      - name: started_on
        description: >
          Jour de publication de l'événement. C'est la clé de croisement avec
          game_review_trend_daily.review_date, et l'abscisse de la barre
          verticale tracée sur la courbe.
        data_tests:
          - not_null

      - name: event_category
        description: >
          Famille d'annonce, restreinte ici aux deux seules qui expliquent un
          mouvement du score : update (le patch) et news (l'actu). Les autres
          catégories de steam_event_categorized (promotion, stream, contest…)
          sont écartées, elles annoncent un événement commercial, pas une
          modification du jeu.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - news
                  - update

      - name: headline
        description: Titre de l'annonce, affiché tel quel dans l'infobulle.
        data_tests:
          - not_null

      - name: votes_up
        description: Votes positifs sur l'annonce.
        data_tests:
          - not_null

      - name: votes_down
        description: Votes négatifs sur l'annonce.
        data_tests:
          - not_null

      - name: comment_count
        description: >
          Nombre de commentaires sur l'annonce, départage les ex æquo en votes.
        data_tests:
          - not_null

      - name: rank_in_year
        description: >
          Rang de l'annonce parmi celles retenues pour son jeu et son année,
          classées par volume de votes décroissant. Va de 1 au cumul des deux
          plafonds (trois annonces discutées plus deux controverses repêchées,
          soit 5 par défaut). Permet au site de réduire encore l'affichage
          sans relancer dbt.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: "{{ var('top_n_events_per_year', 3) + var('top_n_controversial_per_year', 2) }}"

      - name: image_url
        description: >
          Première image du corps de l'annonce, servant de vignette. NULL sur
          la moitié des annonces, qui n'en contiennent aucune.

      - name: pct_negative
        description: >
          Part des votes négatifs sur l'annonce, de 0 à 1. Vaut 0 quand
          personne n'a voté : l'absence de réaction n'est pas un rejet. C'est
          le critère du repêchage des controverses et de is_well_received.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

      - name: is_well_received
        description: >
          Faux quand l'annonce dépasse le seuil de controverse
          (controversy_pct_negative, 25 % de votes négatifs par défaut) tout
          en réunissant assez de votes pour que le ratio veuille dire quelque
          chose (controversy_min_votes, 100 par défaut). Le site en fait la
          couleur du contour de l'infobulle. Le seuil est volontairement plus
          bas que la majorité absolue : à 36 % de votes négatifs, l'annonce du
          report de Cyberpunk 2077 était un rejet, et la compter comme bien
          reçue aurait été un contresens.
        data_tests:
          - not_null
