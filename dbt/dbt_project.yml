name: 'steam_reviews'
version: '1.0.0'

profile: 'steam_reviews'

macro-paths: ['macros', 'tests'] # Some tests are declared as macros
test-paths: ['tests/singular']
docs-paths: ['docs']
clean-targets: [target, logs]

models:
  steam_reviews:
    +materialized: table
    +meta:
      severity: warn
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: table
      +tags: [staging]
      +pre-hook: "SET default_table_access_method = 'columnar'; SET max_parallel_workers_per_gather = 0; SET work_mem = '256MB'"
    intermediate:
      +tags: [intermediate]
    marts:
      +tags: [marts]