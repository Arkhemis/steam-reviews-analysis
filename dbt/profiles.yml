steam_reviews:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | as_number }}"
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      # Un schéma dbt est une base ClickHouse : staging, intermediate, marts
      # viennent de generate_schema_name.
      schema: default
      # Pic de ~1,5 Go par modèle : deux tiennent sous le plafond du serveur.
      threads: 2
      # Le premier build de staging.steam_review dure ~1 h 30.
      send_receive_timeout: 14400
      custom_settings:
        # ReplacingMergeTree : sans FINAL, les doublons en attente de fusion sont lus.
        final: 1
        # LEFT JOIN sans correspondance : NULL, comme Postgres, et non la valeur par défaut.
        join_use_nulls: 1
