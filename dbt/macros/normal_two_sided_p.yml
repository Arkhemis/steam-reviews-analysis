version: 2

macros:
  - name: normal_two_sided_p
    description: |
      p-value bilatérale d'un score z, sous l'hypothèse normale :
      erfc(|z| / √2), avec la fonction native de ClickHouse.
    arguments:
      - name: z
        type: numeric
        description: Score z à convertir, de signe quelconque.
