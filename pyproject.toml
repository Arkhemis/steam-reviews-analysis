[project]
name = "steam-reviews-analysis"
version = "0.1.0"
description = "Personal Project for Steam Analysis"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-CONTENT"]
requires-python = "==3.13.*"

dependencies = [
    "dagster>=1.13.1",
    "dagster-dg-cli>=1.13.1",
    "dagster-webserver>=1.13.1",
    "dagster-postgres>=0.29.1",
    "dagster-dbt>=0.29.1",
    "dagster-docker>=0.29.1",
    "dbt-core>=1.9",
    "httpx>=0.28",
    "tenacity>=9.0",
    "dbt-clickhouse==1.10.3",
    "clickhouse-connect>=0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.10",
    "pytest>=8.0",
    "sqlfluff>=4.2.2",
    "sqlfluff-templater-dbt>=4.2.2",
    "pre-commit>=4.6.1",
    "ipykernel",
    "ipython",
    "chdb>=4.4",
]

[tool.dagster]
module_name = "orchestration.definitions"
code_location_name = "steam_reviews"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestration"

[tool.ruff]
target-version = "py313"
exclude = [".venv", "dags", "dbt/target", "dbt/dbt_packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
