# Overrides de production, à lancer avec :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    volumes:
      - /mnt/pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  website:
    build:
      context: ../steam-reviews-website
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_BASICAUTH_USER: ${ADMIN_BASICAUTH_USER}
      ADMIN_BASICAUTH_HASH: ${ADMIN_BASICAUTH_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      - website
      - dagster-webserver
      - adminer

volumes:
  caddy_data:
  caddy_config:
