# Overrides de production, à lancer avec :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    volumes:
      - type: bind
        source: /mnt/pgdata/postgresql
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  website:
    build:
      context: ../steam-reviews-website
      provenance: false
      sbom: false
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  dbgate:
    image: dbgate/dbgate:latest
    restart: unless-stopped
    environment:
      SKIP_ALL_AUTH: "true"
      CONNECTIONS: postgres
      LABEL_postgres: Postgres
      SERVER_postgres: postgres
      PORT_postgres: "5432"
      USER_postgres: ${POSTGRES_USER}
      PASSWORD_postgres: ${POSTGRES_PASSWORD}
      DATABASE_postgres: ${POSTGRES_DB}
      ENGINE_postgres: postgres@dbgate-plugin-postgres
    volumes:
      - dbgate_data:/root/.dbgate
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_BASICAUTH_USER: ${ADMIN_BASICAUTH_USER}
      ADMIN_BASICAUTH_HASH: ${ADMIN_BASICAUTH_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      - website
      - dagster-webserver
      - dbgate

volumes:
  caddy_data:
  caddy_config:
  dbgate_data:
