# Overrides de production, à lancer avec :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  clickhouse:
    volumes:
      - type: bind
        source: /mnt/pgdata/clickhouse
        target: /var/lib/clickhouse
        bind:
          create_host_path: false
      # Sur le disque local, pas sur le volume : BACKUP ... TO File('...').
      - /var/backups/clickhouse:/backups
      - ./deploy/clickhouse/config.d/steam.xml:/etc/clickhouse-server/config.d/steam.xml:ro
      - ./deploy/clickhouse/users.d/steam.xml:/etc/clickhouse-server/users.d/steam.xml:ro
      - ./deploy/clickhouse/users.d/play.xml:/etc/clickhouse-server/users.d/play.xml:ro
      - ./db/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_PLAY_PASSWORD: ${CLICKHOUSE_PLAY_PASSWORD:?}

  postgres:
    volumes:
      - type: bind
        source: /mnt/pgdata/postgresql-dagster
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

  website:
    build:
      context: ../steam-reviews-website
      provenance: false
      sbom: false
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      clickhouse:
        condition: service_healthy

  dbgate:
    image: dbgate/dbgate:latest
    restart: unless-stopped
    environment:
      SKIP_ALL_AUTH: "true"
      CONNECTIONS: clickhouse,postgres
      LABEL_clickhouse: ClickHouse
      URL_clickhouse: http://clickhouse:8123
      USER_clickhouse: ${CLICKHOUSE_USER}
      PASSWORD_clickhouse: ${CLICKHOUSE_PASSWORD}
      ENGINE_clickhouse: clickhouse@dbgate-plugin-clickhouse
      LABEL_postgres: Postgres
      SERVER_postgres: postgres
      PORT_postgres: "5432"
      USER_postgres: ${POSTGRES_USER}
      PASSWORD_postgres: ${POSTGRES_PASSWORD}
      DATABASE_postgres: ${POSTGRES_DB}
      ENGINE_postgres: postgres@dbgate-plugin-postgres
    volumes:
      - dbgate_data:/root/.dbgate
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_BASICAUTH_USER: ${ADMIN_BASICAUTH_USER}
      ADMIN_BASICAUTH_HASH: ${ADMIN_BASICAUTH_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      - website
      - dagster-webserver
      - dbgate
      - clickhouse

volumes:
  caddy_data:
  caddy_config:
  dbgate_data:
