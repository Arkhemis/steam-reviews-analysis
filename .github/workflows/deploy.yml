name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on VPS
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          install -m 600 -D /dev/null "$HOME/.ssh/deploy_key"
          echo "$VPS_DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          ssh -o StrictHostKeyChecking=accept-new -i "$HOME/.ssh/deploy_key" deploy@2.28.65.8 deploy
