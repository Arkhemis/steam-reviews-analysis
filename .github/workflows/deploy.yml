name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on VPS
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          install -m 600 -D /dev/null "$HOME/.ssh/deploy_key"
          echo "$VPS_DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          install -m 600 -D /dev/null "$HOME/.ssh/known_hosts"
          echo "167.235.145.180 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILlhrq4pbJh/BjQo3kZff7cDtSfCsVX+6SMfZQu4tRqE" > "$HOME/.ssh/known_hosts"
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i "$HOME/.ssh/deploy_key" deploy@167.235.145.180 deploy
