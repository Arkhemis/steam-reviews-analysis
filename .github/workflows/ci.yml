name: CI

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Run Ruff Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        
    - name: Install dependencies
      run: uv sync --group dev

    - name: Lint with Ruff
      run: uv run ruff check .

    - name: Check formatting with Ruff
      run: uv run ruff format --check .

  sql-lint:
    name: Run SQLFluff Lint
    runs-on: ubuntu-latest

    # Le templater dbt se connecte pour compiler les modèles incrémentaux.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.19.9
        env:
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ci
      CLICKHOUSE_PASSWORD: ci

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --group dev

    # Le templater dbt de SQLFluff compile les modèles : dbt_utils doit être là.
    - name: Install dbt packages
      run: uv run dbt deps --project-dir dbt --profiles-dir dbt

    - name: SQLFluff lint
      run: uv run pre-commit run sqlfluff-lint --all-files

  dagster-validate:
    name: Validate Dagster Definitions
    runs-on: ubuntu-latest

    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ci
      CLICKHOUSE_PASSWORD: ci
      IGDB_CLIENT_ID: ci
      IGDB_CLIENT_SECRET: ci

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --group dev

    # Le manifest dbt lu par @dbt_assets ne peut être parsé sans les packages.
    - name: Install dbt packages
      run: uv run dbt deps --project-dir dbt --profiles-dir dbt

    - name: Validate Dagster definitions
      run: uv run dg check defs
