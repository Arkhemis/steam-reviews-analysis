version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    ignore:
      # Changer de version de Python est une migration (requires-python, lock, CI).
      - dependency-name: "python"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    ignore:
      # Une majeure de base de données impose une migration manuelle des volumes.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # ClickHouse sort une version par mois : on ne suit que le changement d'année.
      - dependency-name: "clickhouse/clickhouse-server"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
