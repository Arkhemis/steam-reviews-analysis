storage:
  postgres:
    postgres_db:
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      hostname:
        env: POSTGRES_HOST
      db_name:
        env: POSTGRES_DB
      port:
        env: POSTGRES_PORT

# Un conteneur par run : un `compose up --build` ne tue plus les runs en vol.
run_launcher:
  module: dagster_docker
  class: DockerRunLauncher
  config:
    # definitions.py résout ces EnvVar au chargement du module.
    env_vars:
      - POSTGRES_HOST
      - POSTGRES_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CLICKHOUSE_HOST
      - CLICKHOUSE_PORT
      - CLICKHOUSE_USER
      - CLICKHOUSE_PASSWORD
      - IGDB_CLIENT_ID
      - IGDB_CLIENT_SECRET
    network: steam-reviews-analysis_default
    container_kwargs:
      # Partagé avec le webserver, sinon les stdout/stderr des runs sont perdus.
      volumes:
        - steam-reviews-analysis_dagster_compute_logs:/opt/dagster/dagster_home/compute_logs
      healthcheck:
        test: ["NONE"]
      # Conservé pour run_monitoring. Purge :
      # docker container prune --filter label=dagster/run_id --filter until=336h
      auto_remove: false

# Borne la concurrence pour le rate limit Steam.
run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 4

# Sans ça, un run au conteneur disparu reste STARTED et garde son slot.
run_monitoring:
  enabled: true
  max_resume_run_attempts: 0

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/dagster_home/compute_logs

telemetry:
  enabled: false
