#cloud-config
# Paste this into Hetzner Cloud Console -> Create Server -> "Cloud config" field.
#
# Provisions the VPS baseline for steam-reviews-prod: non-root `deploy` user,
# root/password SSH login disabled, ufw, Docker, and the systemd drop-in that
# stops Docker from starting before the /mnt/pgdata volume is mounted (see the
# 2026-08-01 incident: without it, Docker silently created a Postgres data dir
# on the root disk and 22GB got written there for ~10h before anyone noticed).
#
# Before pasting: replace REPLACE_WITH_YOUR_SSH_PUBLIC_KEY below with your
# actual public key.
#
# Manual step still required after first boot (NOT automated here, since the
# volume already holds the production database and blind automation here is
# too risky):
#   1. Attach the existing Hetzner Volume to the server (Hetzner console).
#   2. SSH in, find the stable device path: ls -l /dev/disk/by-id/ | grep scsi
#   3. Mount it once: sudo mount /dev/disk/by-id/scsi-0HC_Volume_<id> /mnt/pgdata
#   4. Add it to /etc/fstab (use the by-id path, not /dev/sdb — device names
#      aren't guaranteed stable across reboots) with `nofail` so a missing
#      volume degrades to a failed mount instead of a boot hang, e.g.:
#        /dev/disk/by-id/scsi-0HC_Volume_<id> /mnt/pgdata ext4 defaults,nofail 0 0
#   5. sudo systemctl daemon-reload && sudo mount -a
#   6. Verify: df -h /mnt/pgdata should show the real volume, not the root disk.
#   7. Only then: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

users:
  - name: deploy
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - REPLACE_WITH_YOUR_SSH_PUBLIC_KEY

ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - fail2ban
  - git

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
  - path: /etc/systemd/system/docker.service.d/override.conf
    content: |
      [Unit]
      RequiresMountsFor=/mnt/pgdata

runcmd:
  - mkdir -p /mnt/pgdata
  - systemctl restart ssh
  - usermod -aG docker deploy
  - systemctl daemon-reload
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
