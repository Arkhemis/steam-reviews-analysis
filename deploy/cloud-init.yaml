#cloud-config
# Hetzner Cloud Console -> Create Server -> "Cloud config".
#
# Manual steps after first boot (the volume holds the production data):
#   1. Attach the Hetzner Volume, then find it: ls -l /dev/disk/by-id/ | grep scsi
#   2. Add to /etc/fstab by id, with nofail:
#        /dev/disk/by-id/scsi-0HC_Volume_<id> /mnt/pgdata ext4 defaults,nofail 0 0
#   3. sudo systemctl daemon-reload && sudo mount -a ; check df -h /mnt/pgdata
#   4. As `deploy`, clone steam-reviews-analysis and steam-reviews-website into ~/apps, then run `deploy`.

users:
  - name: deploy
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_import_id:
      - gh:Arkhemis

ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - fail2ban
  - git
  - ssh-import-id

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  - path: /etc/systemd/system/docker.service.d/override.conf
    content: |
      [Unit]
      RequiresMountsFor=/mnt/pgdata
  # Frozen: the logic lives in deploy/deploy.sh, read after the pull.
  - path: /usr/local/bin/deploy
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      git -C ~/apps/steam-reviews-analysis pull --ff-only
      exec bash ~/apps/steam-reviews-analysis/deploy/deploy.sh

runcmd:
  - mkdir -p /mnt/pgdata
  - systemctl restart ssh
  - usermod -aG docker deploy
  - systemctl daemon-reload
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
