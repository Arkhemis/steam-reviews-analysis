# Tous les services lisent le .env (cf. .env.example).

x-dagster-env: &dagster-env
  DAGSTER_HOME: /opt/dagster/dagster_home
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
  IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
  DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  DISCORD_MENTION_USER_ID: ${DISCORD_MENTION_USER_ID:-}
  DAGSTER_BASE_URL: ${DAGSTER_BASE_URL:-}

# Cité en dur dans deploy/dagster.yaml.
networks:
  default:
    name: steam-reviews-analysis_default

services:
  clickhouse:
    # Version LTS figée : les réglages de config.d en dépendent.
    image: clickhouse/clickhouse-server:26.8.14.3
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - chdata:/var/lib/clickhouse
      # Un à un : l'image écrit ses propres fichiers dans users.d.
      - ./deploy/clickhouse/config.d/steam.xml:/etc/clickhouse-server/config.d/steam.xml:ro
      - ./deploy/clickhouse/users.d/steam.xml:/etc/clickhouse-server/users.d/steam.xml:ro
      - ./db/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # /ping ne demande pas d'identifiants.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stockage d'instance de Dagster.
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Depuis la 18, PGDATA est /var/lib/postgresql/<majeure>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pas de bind mount : les conteneurs de run exécuteraient un autre code.
  user-code:
    build:
      context: .
      provenance: false
      sbom: false
    image: steam-reviews-analysis-user-code:latest
    restart: unless-stopped
    environment:
      <<: *dagster-env
      DAGSTER_CURRENT_IMAGE: steam-reviews-analysis-user-code:latest
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  dagster-webserver:
    build:
      context: .
      provenance: false
      sbom: false
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      <<: *dagster-env
    # Le HEALTHCHECK de l'image sonde le code server, absent ici.
    healthcheck:
      disable: true
    volumes:
      - ./deploy/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./deploy/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - dagster_compute_logs:/opt/dagster/dagster_home/compute_logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      user-code:
        condition: service_healthy

  dagster-daemon:
    build:
      context: .
      provenance: false
      sbom: false
    entrypoint:
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    restart: unless-stopped
    environment:
      <<: *dagster-env
    # Le HEALTHCHECK de l'image sonde le code server, absent ici.
    healthcheck:
      disable: true
    volumes:
      - ./deploy/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./deploy/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - dagster_compute_logs:/opt/dagster/dagster_home/compute_logs
      # DockerRunLauncher crée un conteneur par run via ce socket.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      user-code:
        condition: service_healthy

volumes:
  pgdata:
  chdata:
  # Cité en dur par DockerRunLauncher.
  dagster_compute_logs:
    name: steam-reviews-analysis_dagster_compute_logs
