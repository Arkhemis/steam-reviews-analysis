# Stack pipeline (PLAN §8), périmètre : IGDB -> Postgres -> reviews -> dbt.
# Tous les services lisent le .env (non commité). Voir .env.example.

x-dagster-env: &dagster-env
  DAGSTER_HOME: /opt/dagster/dagster_home
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
  IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DDL des schémas raw : joué au premier démarrage (base vide).
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Code Dagster + dbt, servi en gRPC. webserver/daemon s'y connectent.
  user-code:
    build:
      context: .
      provenance: false
      sbom: false
    restart: unless-stopped
    environment:
      <<: *dagster-env
    depends_on:
      postgres:
        condition: service_healthy

  dagster-webserver:
    build:
      context: .
      provenance: false
      sbom: false
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      <<: *dagster-env
    volumes:
      - ./deploy/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./deploy/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - dagster_compute_logs:/opt/dagster/dagster_home/compute_logs
    depends_on:
      postgres:
        condition: service_healthy
      user-code:
        condition: service_started

  dagster-daemon:
    build:
      context: .
      provenance: false
      sbom: false
    entrypoint: ["dagster-daemon", "run"]
    restart: unless-stopped
    environment:
      <<: *dagster-env
    volumes:
      - ./deploy/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./deploy/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - dagster_compute_logs:/opt/dagster/dagster_home/compute_logs
    depends_on:
      postgres:
        condition: service_healthy
      user-code:
        condition: service_started

volumes:
  pgdata:
  dagster_compute_logs:
