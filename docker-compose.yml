# Stack pipeline (PLAN §8), périmètre : IGDB -> Postgres -> reviews -> dbt.
# Tous les services lisent le .env (non commité). Voir .env.example.

x-dagster-env: &dagster-env
  DAGSTER_HOME: /opt/dagster/dagster_home
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
  IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}

# Cité en dur dans deploy/dagster.yaml. Valeur identique au nom implicite de
# Compose, donc aucun service existant n'est recréé.
networks:
  default:
    name: steam-reviews-analysis_default

services:
  postgres:
    image: citusdata/citus:14.1-pg16
    command: postgres -c shared_preload_libraries=citus
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DDL des schémas raw : joué au premier démarrage (base vide).
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Code Dagster + dbt, servi en gRPC. webserver/daemon s'y connectent.
  # Pas de bind mount du code : les conteneurs de run ne le verraient pas et
  # exécuteraient donc un autre code que celui servi ici.
  user-code:
    build:
      context: .
      provenance: false
      sbom: false
    image: steam-reviews-analysis-user-code:latest
    restart: unless-stopped
    environment:
      <<: *dagster-env
      # Image que le run launcher utilisera pour les conteneurs de run.
      DAGSTER_CURRENT_IMAGE: steam-reviews-analysis-user-code:latest
    depends_on:
      postgres:
        condition: service_healthy

  dagster-webserver:
    build:
      context: .
      provenance: false
      sbom: false
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      <<: *dagster-env
    # Le HEALTHCHECK de l'image sonde le code server, absent ici.
    healthcheck:
      disable: true
    volumes:
      - ./deploy/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./deploy/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - dagster_compute_logs:/opt/dagster/dagster_home/compute_logs
      # Terminer un run = arrêter son conteneur.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      user-code:
        condition: service_healthy

  dagster-daemon:
    build:
      context: .
      provenance: false
      sbom: false
    entrypoint:
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    restart: unless-stopped
    environment:
      <<: *dagster-env
    # Le HEALTHCHECK de l'image sonde le code server, absent ici.
    healthcheck:
      disable: true
    volumes:
      - ./deploy/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./deploy/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - dagster_compute_logs:/opt/dagster/dagster_home/compute_logs
      # DockerRunLauncher crée un conteneur par run via ce socket.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      user-code:
        condition: service_healthy

volumes:
  pgdata:
  # Nom explicite pour la même raison que le réseau : DockerRunLauncher le cite
  # en dur, or le préfixe de projet dépend du dossier ou de `-p`.
  dagster_compute_logs:
    name: steam-reviews-analysis_dagster_compute_logs
